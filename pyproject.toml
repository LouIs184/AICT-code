[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "aictver2"
version = "2.0.0"
description = "AI CT Image Reconstruction — Refactored"
authors = [
    {name = "AICT Team"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "tensorboard>=2.12.0",
    "tqdm>=4.64.0",
    "pydicom>=2.3.0",
    "opencv-python>=4.7.0",
    "scipy>=1.10.0",
    "scikit-image>=0.19.0",
    "matplotlib>=3.6.0",
    "pillow>=9.5.0",
]

[tool.setuptools]
packages = [
    "src",
    "src.models",
    "src.losses",
    "src.data",
    "src.utils",
    "src.optimizers",
]

[tool.setuptools.package-data]
src = ["py.typed"]

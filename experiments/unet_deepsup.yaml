# UNet2dDeepSuperviser + MixUp + Multi-scale supervision
# Equivalent to the original train_unet_2d_mixup_deepsurperviser.py
experiment:
  name: UNet_DeepSup_MixUp
  seed: 1234

data:
  reader: raw
  train_txt: ./train_img.txt
  valid_txt: ./valid_img.txt
  batch_size: 12
  valid_batch_size: 1
  num_workers: 8

model:
  name: UNet2dDeepSuperviser
  in_chl: 1
  out_chl: 1
  model_chl: 32

loss:
  mse_weight: 1.0
  deep_supervision: true

optimizer:
  name: AdamW
  lr: 0.0001
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.02

scheduler:
  name: StepLR
  step_size: 2
  gamma: 0.95

augment:
  name: mixup
  mixup_alpha: 1.2

training:
  epochs: 200
  save_dir: ./runs/UNet_DeepSup_MixUp
  log_dir: ./runs/UNet_DeepSup_MixUp

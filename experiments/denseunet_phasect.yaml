# DenseUNet2d — PhaseCT (image domain)
# Equivalent to the original train_unet_2d.py
experiment:
  name: DenseUNet_PhaseCT
  seed: 1234

data:
  reader: raw
  train_txt: ./train_img.txt
  valid_txt: ./valid_img.txt
  batch_size: 12
  valid_batch_size: 1
  num_workers: 8
  shuffle: true

model:
  name: DenseUNet2d
  in_chl: 1
  out_chl: 1
  model_chl: 32

loss:
  mse_weight: 1.0
  charbonnier_weight: 0.0
  ssim_weight: 0.0
  vgg_weight: 0.0
  adv_weight: 0.0
  tv_weight: 0.0
  deep_supervision: false

optimizer:
  name: Adam
  lr: 0.0001
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.0

scheduler:
  name: StepLR
  step_size: 2
  gamma: 0.95

training:
  epochs: 200
  save_dir: ./runs/DenseUNet_PhaseCT
  log_dir: ./runs/DenseUNet_PhaseCT
  log_interval: 1
  viz_interval: 1
  save_interval: 20

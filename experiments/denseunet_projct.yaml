# DenseUNet2d — ProjCT (projection domain)
# Equivalent to the original train_unet_proj_2d.py
experiment:
  name: DenseUNet_ProjCT
  seed: 1234

data:
  reader: proj
  train_txt: ./train_proj_img.txt
  valid_txt: ./valid_proj_img.txt
  batch_size: 36
  valid_batch_size: 1
  num_workers: 8
  shuffle: true
  norm_clip_max: 0.28

model:
  name: DenseUNet2d
  in_chl: 1
  out_chl: 1
  model_chl: 32

loss:
  mse_weight: 1.0
  charbonnier_weight: 0.0
  ssim_weight: 0.0
  vgg_weight: 0.0
  adv_weight: 0.0
  tv_weight: 0.0

optimizer:
  name: Adam
  lr: 0.0001
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.0

scheduler:
  name: StepLR
  step_size: 2
  gamma: 0.95

training:
  epochs: 200
  save_dir: ./runs/DenseUNet_ProjCT
  log_dir: ./runs/DenseUNet_ProjCT
  log_interval: 20
  viz_interval: 1
  save_interval: 10

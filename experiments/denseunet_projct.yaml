# DenseUNet2d — ProjCT (projection domain)
# Equivalent to the original train_unet_proj_2d.py
experiment:
  name: DenseUNet_ProjCT
  seed: 1234

data:
  reader: proj
  train_txt: ./train_proj_img.txt
  valid_txt: ./valid_proj_img.txt
  batch_size: 36
  valid_batch_size: 1
  num_workers: 8
  shuffle: true
  norm_clip_max: 0.28
  crop_rows: 32

model:
  name: DenseUNet2d
  in_chl: 1
  out_chl: 1
  model_chl: 32

loss:
  mse_weight: 1.0
  # mse_weight: 0.5
  charbonnier_weight: 0.0
  ssim_weight: 0.0
  vgg_weight: 0.0
  adv_weight: 0.0
  tv_weight: 0.0
  # 添加FocalMSE
  # hard_weight: 1.0
  # hard_gamma: 0.5
  # hard_wmax: 20.0
  # hard_ema_decay: 0.0
  # 添加Focal Frequency Loss (ICCV 2021)
  ffl_weight: 1.0
  ffl_alpha: 1.0
  ffl_patch_factor: 1
  ffl_ave_spectrum: false
  ffl_log_matrix: false
  ffl_batch_matrix: false

optimizer:
  name: Adam
  lr: 0.0001
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.0

scheduler:
  name: StepLR
  step_size: 2
  gamma: 0.95

training:
  epochs: 200
  save_dir: ./runs/0807-0926-DenseUNet_ProjCT
  log_dir: ./runs/0807-0926-DenseUNet_ProjCT
  log_interval: 1
  viz_interval: 1
  save_interval: 20

# DenseUNet2d + SophiaG optimizer + MixUp
# Equivalent to the original train_unet_2d_mixup_sophia.py
experiment:
  name: DenseUNet_Sophia
  seed: 1234

data:
  reader: raw
  train_txt: ./train_img.txt
  valid_txt: ./valid_img.txt
  batch_size: 12
  valid_batch_size: 1
  num_workers: 8

model:
  name: DenseUNet2d
  in_chl: 1
  out_chl: 1
  model_chl: 32

loss:
  mse_weight: 1.0
  charbonnier_weight: 0.0

optimizer:
  name: SophiaG
  lr: 0.0001
  betas: [0.965, 0.99]
  weight_decay: 0.1

scheduler:
  name: StepLR
  step_size: 2
  gamma: 0.95

augment:
  name: mixup
  mixup_alpha: 1.2

training:
  epochs: 200
  save_dir: ./runs/DenseUNet_Sophia
  log_dir: ./runs/DenseUNet_Sophia
